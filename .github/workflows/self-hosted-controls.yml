name: Telemetry acceptance failure controls

on:
  pull_request:
    paths:
      - scripts/accept_self_hosted.py
      - scripts/test_accept_self_hosted_controls.py
      - scripts/test_accept_self_hosted_junit.py
      - scripts/test_accept_self_hosted_metadata.py
      - scripts/test_accept_self_hosted_endpoint.py
      - .github/workflows/self-hosted-controls.yml
      - .github/workflows/self-hosted-acceptance.yml
  push:
    branches: [main]
    paths:
      - scripts/accept_self_hosted.py
      - scripts/test_accept_self_hosted_controls.py
      - scripts/test_accept_self_hosted_junit.py
      - scripts/test_accept_self_hosted_metadata.py
      - scripts/test_accept_self_hosted_endpoint.py
      - .github/workflows/self-hosted-controls.yml
      - .github/workflows/self-hosted-acceptance.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  controls:
    name: Nine bounded real-helper failure controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout selected backend source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify backend source identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run strict JUnit admission regressions
        run: python3 -m unittest discover -s scripts -p test_accept_self_hosted_junit.py -v
      - name: Run metadata token confinement and public package regressions
        run: python3 -m unittest discover -s scripts -p test_accept_self_hosted_metadata.py -v
      - name: Run owned endpoint refresh and readiness diagnostics regressions
        run: python3 -m unittest discover -s scripts -p test_accept_self_hosted_endpoint.py -v
      - name: Run failure controls without Docker or public Core
        run: |
          python3 scripts/test_accept_self_hosted_controls.py \
            --evidence-dir "$RUNNER_TEMP/telemetry-control-results"
      - name: Require nine passes and original result records
        if: always()
        run: |
          python3 scripts/test_accept_self_hosted_controls.py \
            --evidence-dir "$RUNNER_TEMP/telemetry-control-results" --verify-evidence
      - name: Retain sanitized control results even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemetry-acceptance-failure-controls
          path: |
            ${{ runner.temp }}/telemetry-control-results/results.json
            ${{ runner.temp }}/telemetry-control-results/junit.xml
          if-no-files-found: error
          retention-days: 14
