# Validate site output on every pull request; this workflow never deploys.
name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install markdown==3.10.2 pygments==2.20.0 \
            "vouchfx-site-tools @ git+https://github.com/tomas-rampas/vouchfx.git@0d7469530e8177d075fd31bf4707d319bcaf8351#subdirectory=scripts/site-tools"

      - name: Build site (landing page + rendered docs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_site.py _site

      - name: Check private identifiers
        run: python -m vouchfx_site_tools.check_private_identifiers _site

      - name: Check social card
        run: python -m vouchfx_site_tools.check_social_card _site https://telemetry.vouchfx.io/
